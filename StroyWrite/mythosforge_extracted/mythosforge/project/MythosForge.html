<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MythosForge</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07070e;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.07);
    --gold: #c9a055;
    --gold-light: #e8c87a;
    --blue: #6b9fd4;
    --purple: #9b7ec8;
    --teal: #7ec8c8;
    --green: #7ec89b;
    --text: #f0e8d5;
    --text-muted: rgba(240,232,213,0.4);
    --text-dim: rgba(240,232,213,0.22);
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

  #root { height: 100%; display: flex; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  button { font-family: 'DM Sans', sans-serif; }
  input { font-family: 'DM Sans', sans-serif; }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/sidebar.jsx"></script>
<script type="text/babel" src="components/constellation.jsx"></script>
<script type="text/babel" src="components/editor.jsx"></script>
<script type="text/babel" src="components/character.jsx"></script>
<script type="text/babel" src="components/timeline.jsx"></script>
<script type="text/babel" src="components/panels.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "purple",
  "sidebarCollapsed": false,
  "fontStyle": "literary",
  "bgTone": "carbon"
}/*EDITMODE-END*/;

const ACCENT_MAP = {
  gold:   { primary: '#c9a055', secondary: '#e8c87a' },
  blue:   { primary: '#6b9fd4', secondary: '#9bbfe8' },
  purple: { primary: '#9b7ec8', secondary: '#b89ee0' },
  teal:   { primary: '#7ec8c8', secondary: '#9ee0e0' },
};

const BG_MAP = {
  ink:    '#07070e',
  carbon: '#0d0d12',
  warm:   '#0e0b08',
  slate:  '#08080f',
};

function TopBar({ onCommandOpen, activeView }) {
  const VIEW_NAMES = {
    dashboard: 'Constellation Hub', editor: 'Manuscript', characters: 'Characters',
    timeline: 'Timeline', lore: 'Encyclopedia', relationships: 'Relationship Graph',
    maps: 'Maps', inspiration: 'Inspiration Board',
    'char-lyra': 'Lyra Voss', 'char-edren': 'Edren Mourne', 'char-sable': 'Sable of the Ashwood',
    chapter1: 'Chapter I', chapter2: 'Chapter II', chapter3: 'Chapter III',
    'place-ironmere': 'Ironmere', 'place-veiled': 'The Veiled Reach',
  };
  const name = VIEW_NAMES[activeView] || activeView;

  return (
    <div style={{
      height: '48px', flexShrink: 0,
      display: 'flex', alignItems: 'center', gap: '16px',
      padding: '0 20px',
      borderBottom: '1px solid rgba(255,255,255,0.06)',
      background: 'rgba(7,7,14,0.7)', backdropFilter: 'blur(12px)',
    }}>
      {/* Breadcrumb */}
      <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
        <span style={{ fontSize: '11px', color: 'rgba(240,232,213,0.25)' }}>The Ashen Crown</span>
        <span style={{ fontSize: '11px', color: 'rgba(240,232,213,0.15)' }}>›</span>
        <span style={{ fontSize: '12px', color: 'rgba(240,232,213,0.6)' }}>{name}</span>
      </div>

      <div style={{ flex: 1 }} />

      {/* Command search */}
      <button
        onClick={onCommandOpen}
        style={{
          display: 'flex', alignItems: 'center', gap: '10px',
          padding: '6px 12px', borderRadius: '8px',
          background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)',
          color: 'rgba(240,232,213,0.35)', fontSize: '12px', cursor: 'pointer',
          transition: 'background 0.2s, border-color 0.2s',
          width: '200px',
        }}
        onMouseEnter={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.07)'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.14)'; }}
        onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.04)'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.08)'; }}
      >
        <span style={{ fontSize: '12px', color: '#c9a055' }}>⌘</span>
        <span style={{ flex: 1 }}>Quick search…</span>
        <span style={{ fontSize: '10px', border: '1px solid rgba(255,255,255,0.1)', padding: '1px 4px', borderRadius: '3px' }}>K</span>
      </button>

      {/* Icons */}
      <div style={{ display: 'flex', gap: '4px' }}>
        {['🔔', '⚙', '?'].map(ic => (
          <button key={ic} style={{
            width: '32px', height: '32px', borderRadius: '8px', border: 'none',
            background: 'transparent', color: 'rgba(240,232,213,0.3)',
            fontSize: ic === '🔔' ? '14px' : '13px', cursor: 'pointer',
            transition: 'background 0.15s',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}
          onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.06)'}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
          >{ic}</button>
        ))}
      </div>
    </div>
  );
}

function MainContent({ activeView, setActiveView }) {
  // Map sub-views to their parent view's component
  const editorViews = new Set(['editor','chapter1','chapter2','chapter3']);
  const characterViews = new Set(['characters','char-lyra','char-edren','char-sable']);
  const placeViews = new Set(['places','place-ironmere','place-veiled']);

  if (activeView === 'dashboard') return <ConstellationHub setActiveView={setActiveView} />;
  if (editorViews.has(activeView)) return <EditorView />;
  if (characterViews.has(activeView)) return <CharacterSheet />;
  if (activeView === 'timeline') return <TimelineView />;
  if (activeView === 'relationships') return <RelationshipGraph />;
  if (activeView === 'lore') return <EncyclopediaView />;
  if (activeView === 'maps' || placeViews.has(activeView)) return <MapsView />;
  if (activeView === 'inspiration') return <InspirationPanel />;
  return <ConstellationHub setActiveView={setActiveView} />;
}

function App() {
  const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle } = window;

  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeView, setActiveView] = useState('dashboard');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(tweaks.sidebarCollapsed);
  const [cmdOpen, setCmdOpen] = useState(false);

  const accent = ACCENT_MAP[tweaks.accentColor] || ACCENT_MAP.gold;
  const bg = BG_MAP[tweaks.bgTone] || BG_MAP.ink;

  // Inject accent CSS vars dynamically
  useEffect(() => {
    document.documentElement.style.setProperty('--gold', accent.primary);
    document.documentElement.style.setProperty('--gold-light', accent.secondary);
    document.body.style.background = bg;
  }, [accent, bg]);

  // Cmd+K
  useEffect(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        setCmdOpen(o => !o);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const handleSetView = useCallback((view) => {
    setActiveView(view);
  }, []);

  return (
    <div style={{ display: 'flex', width: '100vw', height: '100vh', overflow: 'hidden', background: bg }}>
      {/* Sidebar */}
      <Sidebar
        activeView={activeView}
        setActiveView={handleSetView}
        collapsed={sidebarCollapsed}
        setCollapsed={setSidebarCollapsed}
      />

      {/* Main */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minWidth: 0 }}>
        <TopBar onCommandOpen={() => setCmdOpen(true)} activeView={activeView} />
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex' }}>
          <MainContent activeView={activeView} setActiveView={handleSetView} />
        </div>
      </div>

      {/* Command menu */}
      <CommandMenu open={cmdOpen} onClose={() => setCmdOpen(false)} setActiveView={handleSetView} />

      {/* Tweaks */}
      <TweaksPanel>
        <TweakSection title="Accent Color">
          <TweakRadio
            id="accentColor"
            value={tweaks.accentColor}
            options={['gold', 'blue', 'purple', 'teal']}
            onChange={v => setTweak('accentColor', v)}
          />
        </TweakSection>
        <TweakSection title="Background">
          <TweakRadio
            id="bgTone"
            value={tweaks.bgTone}
            options={['ink', 'carbon', 'warm', 'slate']}
            onChange={v => setTweak('bgTone', v)}
          />
        </TweakSection>
        <TweakSection title="Sidebar">
          <TweakToggle
            label="Collapsed by default"
            value={sidebarCollapsed}
            onChange={v => { setSidebarCollapsed(v); setTweak('sidebarCollapsed', v); }}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
